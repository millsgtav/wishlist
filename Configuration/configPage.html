<!DOCTYPE html>
<div id="wishlistPluginPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary">
            <form id="wishlistSettingsForm">
                <div class="inputContainer">
                    <label for="tmdbApiKey">TMDb API key</label>
                    <input id="tmdbApiKey" type="password" autocomplete="off" class="emby-input" style="display:block;width:100%;box-sizing:border-box" />
                    <div class="fieldDescription">Used only to search TMDb from this Jellyfin server.</div>
                </div>
                <button type="submit" class="raised button-submit block">Save settings</button>
            </form>

            <form id="wishlistSearchForm">
                <div class="inputContainer">
                    <label for="wishlistSearch">Find a movie or TV show</label>
                    <input id="wishlistSearch" type="text" class="emby-input" style="display:block;width:100%;box-sizing:border-box" />
                </div>
                <button type="submit" class="raised block">Search TMDb</button>
            </form>

            <div id="wishlistSearchResults"></div>
            <h2>Shopping list</h2>
            <div id="wishlistItems"></div>
        </div>
    </div>
</div>

<script>
    console.log('[wishlist] script tag reached');
    (function () {
        console.log('[wishlist] IIFE running');
        var pluginId = '611ce32a-d57d-4573-a7ec-bf4748b708f9';
        // Scope to this script's own page instance; querying by id can hit a stale duplicate left from a previous visit to this page.
        var page = document.currentScript ? document.currentScript.previousElementSibling : null;
        if (!page) {
            page = document.querySelector('#wishlistPluginPage');
        }
        console.log('[wishlist] page element resolved:', page);

        function request(method, path, data) {
            return ApiClient.ajax({
                type: method,
                url: ApiClient.getUrl(path),
                data: data ? JSON.stringify(data) : undefined,
                contentType: 'application/json'
            });
        }

        function text(value) {
            return document.createTextNode(value || '');
        }

        function makeResult(item, target, canAdd) {
            var row = document.createElement('div');
            row.className = 'listItem';
            if (item.PosterUrl) {
                var image = document.createElement('img');
                image.src = item.PosterUrl;
                image.alt = '';
                image.style.cssText = 'width:52px;height:78px;object-fit:cover;margin-right:1em';
                row.appendChild(image);
            }
            var details = document.createElement('div');
            details.className = 'listItemBody';
            var title = document.createElement('div');
            title.className = 'listItemBodyText';
            title.appendChild(text(item.Title + (item.Year ? ' (' + item.Year + ')' : '')));
            details.appendChild(title);
            var type = document.createElement('div');
            type.className = 'fieldDescription';
            type.appendChild(text(item.MediaType === 'tv' ? 'TV show' : 'Movie'));
            details.appendChild(type);
            row.appendChild(details);
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'raised';
            button.appendChild(text(canAdd ? 'Add' : 'Remove'));
            button.addEventListener('click', function () {
                if (canAdd) {
                    request('POST', 'Wishlist', item).then(function () { loadItems(); target.innerHTML = ''; });
                } else {
                    request('DELETE', 'Wishlist/' + item.Id).then(loadItems);
                }
            });
            row.appendChild(button);
            target.appendChild(row);
        }

        function loadItems() {
            var target = page.querySelector('#wishlistItems');
            target.innerHTML = '';
            request('GET', 'Wishlist').then(function (items) {
                if (!items.length) {
                    target.appendChild(text('Your shopping list is empty.'));
                    return;
                }
                items.forEach(function (item) { makeResult(item, target, false); });
            });
        }

        page.querySelector('#wishlistSettingsForm').addEventListener('submit', function (event) {
            event.preventDefault();
            console.log('[wishlist] save settings submitted');
            ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                config.TmdbApiKey = page.querySelector('#tmdbApiKey').value;
                return ApiClient.updatePluginConfiguration(pluginId, config);
            }).then(function () { console.log('[wishlist] save succeeded'); Dashboard.alert('Wishlist settings saved.'); })
              .catch(function (err) { console.error('[wishlist] save failed', err); });
        });

        page.querySelector('#wishlistSearchForm').addEventListener('submit', function (event) {
            event.preventDefault();
            console.log('[wishlist] search submitted');
            var target = page.querySelector('#wishlistSearchResults');
            target.innerHTML = '';
            request('GET', 'Wishlist/search?query=' + encodeURIComponent(page.querySelector('#wishlistSearch').value))
                .then(function (items) { console.log('[wishlist] search results', items); items.forEach(function (item) { makeResult(item, target, true); }); })
                .catch(function (err) { console.error('[wishlist] search failed', err); Dashboard.alert('TMDb search failed. Save a valid API key, then try again.'); });
        });

        console.log('[wishlist] listeners attached');

        page.addEventListener('viewshow', function () {
            ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                page.querySelector('#tmdbApiKey').value = config.TmdbApiKey || '';
            });
            loadItems();
        });
    }());
</script>
