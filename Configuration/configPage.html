<!DOCTYPE html>
<div id="wishlistPluginPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary">
            <style>
                #wishlistPluginPage .wishlistSettings {
                    border: 1px solid rgba(255, 255, 255, 0.1);
                    border-radius: 0.5em;
                    margin-bottom: 1.5em;
                    overflow: hidden;
                }
                #wishlistPluginPage .wishlistSettings summary {
                    cursor: pointer;
                    padding: 0.9em 1.1em;
                    font-weight: 600;
                    list-style: none;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                }
                #wishlistPluginPage .wishlistSettings summary::-webkit-details-marker {
                    display: none;
                }
                #wishlistPluginPage .wishlistSettings summary::after {
                    content: '\25BE';
                    transition: transform 0.15s ease;
                    opacity: 0.7;
                }
                #wishlistPluginPage .wishlistSettings[open] summary::after {
                    transform: rotate(180deg);
                }
                #wishlistPluginPage .wishlistSettingsBody {
                    padding: 0 1.1em 1.1em;
                }
                #wishlistPluginPage .wishlistInput {
                    display: block;
                    width: 100%;
                    box-sizing: border-box;
                    padding: 0.6em 0.8em;
                    border-radius: 0.4em;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    background: rgba(255, 255, 255, 0.04);
                    color: inherit;
                    font-size: 1em;
                }
                #wishlistPluginPage .wishlistInput:focus {
                    outline: none;
                    border-color: #00a4dc;
                    box-shadow: 0 0 0 2px rgba(0, 164, 220, 0.25);
                }
                #wishlistPluginPage .wishlistButton {
                    border: none;
                    border-radius: 0.4em;
                    padding: 0.55em 1.2em;
                    font-weight: 600;
                    cursor: pointer;
                    background: #00a4dc;
                    color: #fff;
                    transition: background 0.15s ease, transform 0.05s ease;
                }
                #wishlistPluginPage .wishlistButton:hover {
                    background: #0088b8;
                }
                #wishlistPluginPage .wishlistButton:active {
                    transform: scale(0.98);
                }
                #wishlistPluginPage .wishlistButton.secondary {
                    background: rgba(255, 255, 255, 0.1);
                }
                #wishlistPluginPage .wishlistButton.secondary:hover {
                    background: rgba(255, 255, 255, 0.18);
                }
                #wishlistPluginPage .wishlistSearchBar {
                    display: flex;
                    gap: 0.6em;
                    margin-bottom: 1.5em;
                }
                #wishlistPluginPage .wishlistSearchBar .wishlistInput {
                    flex: 1;
                }
                #wishlistPluginPage .wishlistFilters {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 0.5em;
                    margin: 0 0 1.2em;
                }
                #wishlistPluginPage .wishlistFilterGroup {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 0.35em;
                }
                #wishlistPluginPage .wishlistFilterPill {
                    border: 1px solid rgba(255, 255, 255, 0.18);
                    border-radius: 999px;
                    padding: 0.4em 0.85em;
                    background: rgba(255, 255, 255, 0.05);
                    color: inherit;
                    cursor: pointer;
                    font-size: 0.85em;
                }
                #wishlistPluginPage .wishlistFilterPill:hover,
                #wishlistPluginPage .wishlistFilterPill.active {
                    border-color: #00a4dc;
                    background: rgba(0, 164, 220, 0.2);
                }
                #wishlistPluginPage h2 {
                    font-size: 1.15em;
                    margin: 0;
                }
                #wishlistPluginPage .wishlistListHeader {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 0.75em;
                    margin: 1.6em 0 0.7em;
                }
                #wishlistPluginPage .wishlistRescanButton {
                    flex: 0 0 auto;
                    padding: 0.35em 0.8em;
                    font-size: 0.85em;
                }
                #wishlistPluginPage .wishlistGrid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                    gap: 1em;
                }
                #wishlistPluginPage .wishlistCard {
                    background: rgba(255, 255, 255, 0.04);
                    border: 1px solid rgba(255, 255, 255, 0.08);
                    border-radius: 0.6em;
                    overflow: hidden;
                    display: flex;
                    flex-direction: column;
                    transition: transform 0.15s ease, border-color 0.15s ease;
                }
                #wishlistPluginPage .wishlistCard:hover {
                    transform: translateY(-2px);
                    border-color: rgba(255, 255, 255, 0.2);
                }
                #wishlistPluginPage .wishlistCardPoster {
                    width: 100%;
                    aspect-ratio: 2 / 3;
                    object-fit: cover;
                    background: rgba(255, 255, 255, 0.06);
                }
                #wishlistPluginPage .wishlistCardBody {
                    padding: 0.7em 0.8em;
                    display: flex;
                    flex-direction: column;
                    gap: 0.35em;
                    flex: 1;
                }
                #wishlistPluginPage .wishlistCardTitle {
                    font-weight: 600;
                    font-size: 0.95em;
                    line-height: 1.25;
                }
                #wishlistPluginPage .wishlistBadge {
                    align-self: flex-start;
                    font-size: 0.72em;
                    text-transform: uppercase;
                    letter-spacing: 0.03em;
                    padding: 0.15em 0.5em;
                    border-radius: 1em;
                    background: rgba(0, 164, 220, 0.18);
                    color: #6fd0f5;
                }
                #wishlistPluginPage .wishlistBadge-inLibrary {
                    background: rgba(82, 196, 26, 0.18);
                    color: #7bdb63;
                }
                #wishlistPluginPage .wishlistCardBody .wishlistButton {
                    margin-top: auto;
                    width: 100%;
                }
                #wishlistPluginPage .wishlistEmpty {
                    opacity: 0.7;
                    padding: 0.5em 0;
                }
                @media (max-width: 600px) {
                    #wishlistPluginPage #wishlistItems {
                        gap: 0.45em;
                    }
                    #wishlistPluginPage #wishlistItems .wishlistCard {
                        display: grid;
                        grid-template-columns: 3.5em minmax(0, 1fr);
                        min-height: 3.5em;
                    }
                    #wishlistPluginPage #wishlistItems .wishlistCardPoster {
                        width: 3.5em;
                        height: 5.25em;
                        grid-row: 1;
                    }
                    #wishlistPluginPage #wishlistItems .wishlistCardBody {
                        min-width: 0;
                        padding: 0.45em 0.6em;
                        gap: 0.2em;
                    }
                    #wishlistPluginPage #wishlistItems .wishlistBadge {
                        font-size: 0.65em;
                    }
                    #wishlistPluginPage #wishlistItems .wishlistCardTitle {
                        font-size: 0.85em;
                        line-height: 1.15;
                    }
                    #wishlistPluginPage #wishlistItems .wishlistButton {
                        padding: 0.3em 0.7em;
                        font-size: 0.8em;
                    }
                }
            </style>

            <details class="wishlistSettings">
                <summary>Settings</summary>
                <div class="wishlistSettingsBody">
                    <form id="wishlistSettingsForm">
                        <div class="inputContainer">
                            <label for="tmdbApiKey">TMDb API key</label>
                            <input id="tmdbApiKey" type="password" autocomplete="off" class="wishlistInput" />
                            <div class="fieldDescription">Used only to search TMDb from this Jellyfin server.</div>
                        </div>
                        <button type="submit" class="wishlistButton">Save settings</button>
                    </form>
                </div>
            </details>

            <div class="wishlistFilters" aria-label="Shopping list filters">
                <div class="wishlistFilterGroup" role="group" aria-label="Sort shopping list">
                    <button type="button" class="wishlistFilterPill active" data-sort="title-asc">A-Z</button>
                    <button type="button" class="wishlistFilterPill" data-sort="title-desc">Z-A</button>
                    <button type="button" class="wishlistFilterPill" data-sort="date-added">Date Added</button>
                </div>
                <div class="wishlistFilterGroup" role="group" aria-label="Filter by media type">
                    <button type="button" class="wishlistFilterPill active" data-media-type="all">All</button>
                    <button type="button" class="wishlistFilterPill" data-media-type="movie">Movies</button>
                    <button type="button" class="wishlistFilterPill" data-media-type="tv">TV Shows</button>
                </div>
            </div>

            <form id="wishlistSearchForm" class="wishlistSearchBar">
                <input id="wishlistSearch" type="text" class="wishlistInput" placeholder="Find a movie or TV show" />
                <button type="submit" class="wishlistButton">Search</button>
            </form>

            <div id="wishlistSearchResults" class="wishlistGrid"></div>

            <div class="wishlistListHeader">
                <h2>Shopping list</h2>
                <button id="wishlistRescan" type="button" class="wishlistButton secondary wishlistRescanButton">Rescan</button>
            </div>
            <div id="wishlistItems" class="wishlistGrid"></div>
        </div>
    </div>

    <script>
    (function () {
        var pluginId = '611ce32a-d57d-4573-a7ec-bf4748b708f9';
        var wishlistItems = [];
        var selectedSort = 'title-asc';
        var selectedMediaType = 'all';
        // Jellyfin's view cache can hold a stale, already-initialized copy of this page; always pick the fresh one.
        var page = document.querySelector('#wishlistPluginPage:not([data-wishlist-ready])') || document.querySelector('#wishlistPluginPage');
        page.setAttribute('data-wishlist-ready', 'true');

        function request(method, path, data) {
            return ApiClient.ajax({
                type: method,
                url: ApiClient.getUrl(path),
                data: data ? JSON.stringify(data) : undefined,
                contentType: 'application/json',
                dataType: method === 'DELETE' ? undefined : 'json'
            }).then(function (result) {
                // Some ApiClient versions ignore dataType and resolve with the raw fetch Response; unwrap it ourselves.
                if (method !== 'DELETE' && result && typeof result.json === 'function') {
                    return result.json();
                }
                return result;
            });
        }

        function text(value) {
            return document.createTextNode(value || '');
        }

        function makeCard(item, target, canAdd) {
            var card = document.createElement('div');
            card.className = 'wishlistCard';

            if (item.PosterUrl) {
                var image = document.createElement('img');
                image.className = 'wishlistCardPoster';
                image.src = item.PosterUrl;
                image.alt = '';
                card.appendChild(image);
            }

            var body = document.createElement('div');
            body.className = 'wishlistCardBody';

            var badge = document.createElement('span');
            badge.className = 'wishlistBadge';
            badge.appendChild(text(item.MediaType === 'tv' ? 'TV show' : 'Movie'));
            body.appendChild(badge);

            if (item.InLibrary) {
                var libraryBadge = document.createElement('span');
                libraryBadge.className = 'wishlistBadge wishlistBadge-inLibrary';
                libraryBadge.appendChild(text('Already in library'));
                body.appendChild(libraryBadge);
            }

            var title = document.createElement('div');
            title.className = 'wishlistCardTitle';
            title.appendChild(text(item.Title + (item.Year ? ' (' + item.Year + ')' : '')));
            body.appendChild(title);

            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'wishlistButton' + (canAdd ? '' : ' secondary');
            button.appendChild(text(canAdd ? 'Add to list' : 'Remove'));
            button.addEventListener('click', function () {
                if (canAdd) {
                    request('POST', 'Wishlist', item).then(function () { loadItems(); target.innerHTML = ''; });
                } else {
                    request('DELETE', 'Wishlist/' + item.Id).then(loadItems);
                }
            });
            body.appendChild(button);

            card.appendChild(body);
            target.appendChild(card);
        }

        function loadItems() {
            var target = page.querySelector('#wishlistItems');
            var rescanButton = page.querySelector('#wishlistRescan');
            target.innerHTML = '';
            rescanButton.disabled = true;
            rescanButton.textContent = 'Scanning...';
            request('GET', 'Wishlist').then(function (items) {
                wishlistItems = items;
                renderItems();
            }).catch(function (err) {
                console.error('[wishlist] rescan failed', err);
                target.appendChild(text('Unable to refresh the shopping list.'));
            }).then(function () {
                rescanButton.disabled = false;
                rescanButton.textContent = 'Rescan';
            });
        }

        function renderItems() {
            var target = page.querySelector('#wishlistItems');
            var items = wishlistItems.filter(function (item) {
                return selectedMediaType === 'all' || item.MediaType === selectedMediaType;
            });

            items.sort(function (left, right) {
                if (selectedSort === 'date-added') {
                    return new Date(right.AddedAt) - new Date(left.AddedAt);
                }

                var comparison = left.Title.localeCompare(right.Title, undefined, { sensitivity: 'base' });
                return selectedSort === 'title-desc' ? -comparison : comparison;
            });

            target.innerHTML = '';
            if (!items.length) {
                    var empty = document.createElement('div');
                    empty.className = 'wishlistEmpty';
                    empty.appendChild(text(wishlistItems.length ? 'No items match these filters.' : 'Your shopping list is empty.'));
                    target.appendChild(empty);
                    return;
                }
                items.forEach(function (item) { makeCard(item, target, false); });
        }

        page.querySelectorAll('[data-sort]').forEach(function (button) {
            button.addEventListener('click', function () {
                selectedSort = button.getAttribute('data-sort');
                page.querySelectorAll('[data-sort]').forEach(function (item) { item.classList.remove('active'); });
                button.classList.add('active');
                renderItems();
            });
        });

        page.querySelectorAll('[data-media-type]').forEach(function (button) {
            button.addEventListener('click', function () {
                selectedMediaType = button.getAttribute('data-media-type');
                page.querySelectorAll('[data-media-type]').forEach(function (item) { item.classList.remove('active'); });
                button.classList.add('active');
                renderItems();
            });
        });

        page.querySelector('#wishlistRescan').addEventListener('click', loadItems);

        page.querySelector('#wishlistSettingsForm').addEventListener('submit', function (event) {
            event.preventDefault();
            ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                config.TmdbApiKey = page.querySelector('#tmdbApiKey').value;
                return ApiClient.updatePluginConfiguration(pluginId, config);
            }).then(function () { Dashboard.alert('Wishlist settings saved.'); })
              .catch(function (err) { console.error('[wishlist] save failed', err); });
        });

        page.querySelector('#wishlistSearchForm').addEventListener('submit', function (event) {
            event.preventDefault();
            var target = page.querySelector('#wishlistSearchResults');
            target.innerHTML = '';
            request('GET', 'Wishlist/search?query=' + encodeURIComponent(page.querySelector('#wishlistSearch').value))
                .then(function (items) { items.forEach(function (item) { makeCard(item, target, true); }); })
                .catch(function (err) { console.error('[wishlist] search failed', err); Dashboard.alert('TMDb search failed. Save a valid API key, then try again.'); });
        });

        page.addEventListener('viewshow', function () {
            ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                page.querySelector('#tmdbApiKey').value = config.TmdbApiKey || '';
            });
            loadItems();
        });
    }());
    </script>
</div>
